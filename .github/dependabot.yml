version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # Minor e patch vêm agrupados porque um PR por pacote em um projeto com ~60
  # dependências vira ruído que ninguém revisa. Major fica de fora do grupo: é
  # o único que costuma quebrar, e quebrar sozinho é o que torna o PR legível.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      composer-minor-e-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      npm-minor-e-patch:
        update-types:
          - "minor"
          - "patch"
